[package]
name = "market-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Catalog engine for the OpenCode marketplace"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
